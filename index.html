<!doctype html>
<!-- Temporary home of thebigboyrules.com while the club website is finished.
     Same world as the app's update journey: warm darkness, light rays, mist, golden dust
     and echoing Anton titles. Interactive: the dust follows your finger, a tap scatters it,
     and holding the button "builds" the page. Assets live in /obra/. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0d">
  <title>The Big Boy Rules · En construcción</title>
  <meta name="description" content="Estamos preparando la web del club: moda, ocio, fotos y los sitios a los que volvemos.">
  <meta property="og:title" content="The Big Boy Rules">
  <meta property="og:description" content="Web en construcción.">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="obra/anton.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: Anton; src: url("obra/anton.woff2") format("woff2"); font-display: block; }
    @font-face { font-family: Archivo; src: url("obra/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
    :root { --bg: #100e0d; --text: #f4eee6; --muted: #c7bab0; --line: #f4eee62e; --x: .5; --y: .4; --built: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    a { color: inherit; text-decoration: none; }
    button { appearance: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid #eee7df; outline-offset: 4px; }

    .stage { position: fixed; inset: 0; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; isolation: isolate; }
    /* Atmosphere, as in the app's update screen. */
    .atmo { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .halo { position: absolute; inset: 0; background: radial-gradient(ellipse at calc(var(--x) * 100%) calc(var(--y) * 100% - 10%), #efc48855, transparent 46%); transition: background-position .6s; animation: halo 6s ease-in-out infinite alternate; }
    .rays { position: absolute; inset: -20% -15%; background: linear-gradient(99deg, transparent 12%, #ffe2b840 15%, #ffe4c026 18%, transparent 22%, transparent 38%, #f8ddb44d 41%, #ffe4c026 44%, transparent 49%, transparent 66%, #ffe2b838 69%, transparent 75%); filter: blur(9px); opacity: .85;
      transform: rotate(calc(8deg + var(--x) * 8deg)) translateX(calc((var(--x) - .5) * -6%)); transition: transform 1.2s cubic-bezier(.2,.7,.2,1); animation: light 8s ease-in-out infinite alternate; }
    .mist { position: absolute; inset: -20% -40%; background: radial-gradient(ellipse at 25% 70%, #ccb39499, transparent 46%), radial-gradient(ellipse at 75% 42%, #b9a08480, transparent 42%); filter: blur(22px); opacity: calc(.55 - var(--built) * .35); animation: fog 12s ease-in-out infinite alternate; transition: opacity 1.4s ease; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .grain { position: absolute; inset: 0; opacity: .06; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 4px 4px; mix-blend-mode: overlay; }
    @keyframes halo { to { opacity: .7; } }
    @keyframes light { to { filter: blur(12px); opacity: .6; } }
    @keyframes fog { to { transform: translate3d(6%, -3%, 0); } }

    .top, .bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: max(16px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left)); font-size: 12px; letter-spacing: .025em; }
    .bottom { padding: 0 max(24px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); color: var(--muted); }
    .top span { font-weight: 600; }
    .top a, .bottom a { padding: 10px 0; text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--line); }
    @media (hover: hover) { .top a:hover, .bottom a:hover { opacity: .8; } }

    .center { align-self: center; justify-self: center; width: min(100% - 48px, 760px); text-align: center; display: grid; justify-items: center; }
    .logo { width: min(64vw, 360px); height: auto; filter: drop-shadow(0 18px 40px #0009); opacity: 0; animation: logo-in 1.8s .2s cubic-bezier(.2,.7,.2,1) forwards; }
    .logo.shake { animation: shake .5s ease-in-out; opacity: 1; }
    @keyframes logo-in { from { opacity: 0; filter: blur(14px) drop-shadow(0 18px 40px #0009); transform: scale(1.06); } to { opacity: 1; filter: drop-shadow(0 18px 40px #0009); transform: none; } }
    @keyframes shake { 20% { transform: translate(-3px, 1px) rotate(-.6deg); } 40% { transform: translate(3px, -1px) rotate(.6deg); } 60% { transform: translate(-2px, 0); } 80% { transform: translate(2px, 1px); } }
    .eyebrow { margin: 34px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
    h1 { position: relative; margin: 14px 0 0; font: 400 clamp(46px, 11vw, 104px)/1.02 Anton, sans-serif; letter-spacing: .085em; text-transform: uppercase; text-wrap: balance; }
    /* The echo: two ghost copies that settle into the title. */
    h1::before, h1::after { content: attr(data-echo); position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    h1.in { animation: clarity 1.2s ease-out both; }
    h1.in::before { animation: echo-top 1.2s cubic-bezier(.22,.6,.3,1) both; }
    h1.in::after { animation: echo-bottom 1.2s cubic-bezier(.22,.6,.3,1) both; }
    @keyframes clarity { from { filter: blur(6px); opacity: .4; } to { filter: none; opacity: 1; } }
    @keyframes echo-top { 0%, 12% { opacity: .5; transform: translate(-12px, -36px); filter: blur(2px); } 65% { opacity: .3; } 100% { opacity: 0; transform: none; filter: none; } }
    @keyframes echo-bottom { 0%, 12% { opacity: .45; transform: translate(14px, 32px); filter: blur(2px); } 65% { opacity: .3; } 100% { opacity: 0; transform: none; filter: none; } }
    .lede { max-width: 44ch; margin: 18px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .sections { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; margin: 22px 0 0; padding: 0; list-style: none; font: 400 clamp(18px, 3.6vw, 24px)/1 Anton, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    .sections li { opacity: .22; transform: translateY(6px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
    .sections li.on { opacity: 1; transform: none; }

    /* Hold to build. Neutral states only: no golden highlight on press. */
    .build { position: relative; margin: 34px 0 0; min-height: 52px; padding: 0 26px; display: inline-flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; letter-spacing: .06em; overflow: hidden; }
    .build::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #f4eee61f; transform-origin: left; transform: scaleX(var(--hold, 0)); }
    .build.done { pointer-events: none; opacity: .6; }
    .build svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .hint { margin: 12px 0 0; min-height: 18px; font-size: 12px; color: var(--muted); letter-spacing: .03em; }
    .meter { width: min(260px, 70vw); height: 2px; margin: 18px 0 0; background: var(--line); overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--text); transform-origin: left; transform: scaleX(var(--built)); transition: transform .6s cubic-bezier(.2,.7,.2,1); }

    .bottom .links { display: flex; gap: 20px; }
    /* Cookie notice: informs only (technical storage). Neutral pressed state. */
    .cookie { position: fixed; z-index: 10; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); max-width: 540px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px 18px; padding: 14px 14px 14px 18px; border: 1px solid var(--line); border-radius: 18px; background: #1b1715f2; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px #0008; font-size: 13px; line-height: 1.5; color: var(--muted); animation: note-in .6s 1.2s cubic-bezier(.2,.7,.2,1) both; transition: opacity .3s, transform .3s; }
    .cookie a { color: var(--text); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line); white-space: nowrap; }
    .cookie button { flex: none; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; transition: opacity .18s; }
    .cookie button:active { opacity: .7; }
    .cookie.gone { opacity: 0; transform: translateY(12px); }
    @keyframes note-in { from { opacity: 0; transform: translateY(16px); } }
    @media (max-width: 480px) { .cookie { flex-direction: column; align-items: stretch; } }
    @media (max-height: 640px) { .logo { width: min(46vw, 260px); } .eyebrow { margin-top: 18px; } .build { margin-top: 20px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .logo { opacity: 1; } canvas { display: none; } }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="atmo" aria-hidden="true"><div class="halo"></div><div class="rays"></div><div class="mist"></div><canvas id="dust"></canvas><div class="grain"></div></div>
    <header class="top"><span>The Big Boy Rules</span><a href="https://www.instagram.com/thebigboyrules" target="_blank" rel="noopener">Instagram</a></header>
    <section class="center" aria-labelledby="t">
      <img class="logo" id="logo" src="obra/bbr.webp" alt="Big Boy Rules" width="1080" height="293">
      <p class="eyebrow">Madrid</p>
      <h1 id="t" data-echo="En construcción" class="in">En construcción</h1>
      <p class="lede" id="lede">Estamos levantando la web del club: lo que llevamos, lo que hacemos, nuestras fotos y los sitios a los que volvemos.</p>
      <ul class="sections" id="sections" aria-label="Lo que habrá"><li>Moda</li><li>Ocio</li><li>Fotos</li><li>Sitios</li></ul>
      <div class="meter" aria-hidden="true"><i></i></div>
      <button class="build" id="build" type="button" aria-describedby="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6"/></svg><span id="buildText">Mantén para construir</span></button>
      <p class="hint" id="hint" role="status" aria-live="polite">Cada vez que lo mantienes, ponemos una parte.</p>
    </section>
    <footer class="bottom"><span>© 2026</span><span class="links"><a href="cookies.html">Cookies</a><a href="mailto:thebigboyrulesapp@gmail.com">Contacto</a></span></footer>
  </main>
  <script>
  (() => {
    'use strict';
    const root = document.documentElement, $ = id => document.getElementById(id);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ------------------------------------------------ light follows the finger / cursor
    let tx = .5, ty = .4;
    addEventListener('pointermove', e => { tx = e.clientX / innerWidth; ty = e.clientY / innerHeight; root.style.setProperty('--x', tx.toFixed(3)); root.style.setProperty('--y', ty.toFixed(3)); }, {passive: true});

    // ------------------------------------------------ golden dust (three depths), pushed by the pointer
    const canvas = $('dust'), ctx = canvas.getContext && canvas.getContext('2d');
    const motes = Array.from({length: 70}, (_, i) => ({x: (i * .371) % 1, y: (i * .217) % 1, d: i % 3, p: i * 2.4, vx: 0, vy: 0}));
    const sparks = [];
    let last = 0, W = 0, H = 0, ratio = 1;
    function size() { ratio = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; canvas.width = W * ratio; canvas.height = H * ratio; }
    size(); addEventListener('resize', size);
    function draw(time) {
      requestAnimationFrame(draw);
      if (!ctx || document.hidden || (last && time - last < 1000 / 40)) return;
      const dt = last ? Math.min(60, time - last) : 16; last = time;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0); ctx.clearRect(0, 0, W, H);
      const px = tx * W, py = ty * H;
      for (const m of motes) {
        let x = m.x * W + Math.sin(time * .0002 + m.p) * (8 + m.d * 9), y = m.y * H;
        const dx = x - px, dy = y - py, dist = Math.hypot(dx, dy) || 1;
        if (dist < 140) { const f = (140 - dist) / 140 * (m.d + 1) * .0009; m.vx += dx / dist * f; m.vy += dy / dist * f; }
        m.vx *= .94; m.vy *= .94;
        m.x = (m.x + m.vx * dt / 16 + 1) % 1;
        m.y = (m.y - dt * [.000012, .000025, .00005][m.d] + m.vy * dt / 16 + 1) % 1;
        const r = [.8, 1.8, 5][m.d];
        if (m.d === 2) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,222,161,.48)'); g.addColorStop(.35, 'rgba(245,201,132,.27)'); g.addColorStop(1, 'rgba(245,201,132,0)'); ctx.fillStyle = g; }
        else ctx.fillStyle = m.d ? 'rgba(255,221,164,.64)' : 'rgba(247,222,196,.42)';
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i]; s.life -= dt; if (s.life <= 0) { sparks.splice(i, 1); continue; }
        s.x += s.vx * dt; s.y += s.vy * dt; s.vy += .00025 * dt; s.vx *= .985;
        ctx.fillStyle = `rgba(255,224,170,${(s.life / s.max * .85).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (!reduced) requestAnimationFrame(draw);
    function burst(x, y, n = 26, power = .32) {
      if (reduced) return;
      for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = power * (.35 + Math.random()); sparks.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .08, r: .8 + Math.random() * 2.2, life: 700 + Math.random() * 700, max: 1400}); }
    }
    addEventListener('pointerdown', e => { if (!e.target.closest('a, button')) burst(e.clientX, e.clientY, 18, .22); });

    // ------------------------------------------------ hold to build: four holds, one section each
    const button = $('build'), hint = $('hint'), title = $('t'), items = [...$('sections').children], logo = $('logo');
    const HOLD = 1100;
    let built = 0, start = 0, raf = 0, holding = false;
    const lines = ['Moda, en marcha.', 'Ocio, en marcha.', 'Fotos, en marcha.', 'Sitios, en marcha.'];
    function setHold(v) { button.style.setProperty('--hold', v.toFixed(3)); }
    function step(now) {
      if (!holding) return;
      const p = Math.min(1, (now - start) / HOLD); setHold(p);
      if (p >= 1) return complete();
      raf = requestAnimationFrame(step);
    }
    function begin(e) {
      if (built >= 4 || holding) return;
      e.preventDefault(); holding = true; start = performance.now();
      try { button.setPointerCapture(e.pointerId); } catch {}
      raf = requestAnimationFrame(step);
    }
    function end() {
      if (!holding) return;
      holding = false; cancelAnimationFrame(raf);
      // Let go too early: the bar slides back.
      const from = parseFloat(button.style.getPropertyValue('--hold')) || 0, t0 = performance.now();
      const back = now => { const p = Math.min(1, (now - t0) / 260); setHold(from * (1 - p)); if (p < 1 && !holding) requestAnimationFrame(back); };
      requestAnimationFrame(back);
      if (from < 1 && from > .05) hint.textContent = 'Mantén un poco más.';
    }
    function complete() {
      holding = false; setHold(0);
      items[built].classList.add('on'); hint.textContent = lines[built]; built++;
      root.style.setProperty('--built', (built / 4).toFixed(2));
      const r = button.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 34, .36);
      if (navigator.vibrate) navigator.vibrate(12);
      logo.classList.remove('shake'); void logo.offsetWidth; logo.classList.add('shake');
      if (built === 4) {
        setTimeout(() => {
          title.classList.remove('in'); void title.offsetWidth;
          title.textContent = 'Muy pronto'; title.dataset.echo = 'Muy pronto'; title.classList.add('in');
          $('buildText').textContent = 'Construido'; button.classList.add('done');
          hint.textContent = 'Gracias por echar una mano. Síguenos en Instagram mientras tanto.';
          const l = logo.getBoundingClientRect(); burst(l.left + l.width / 2, l.top + l.height / 2, 80, .5);
        }, 380);
      }
    }
    button.addEventListener('pointerdown', begin);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => button.addEventListener(type, end));
    button.addEventListener('contextmenu', e => e.preventDefault());
    // Keyboard: hold Space or Enter.
    button.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) begin(e); });
    button.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') end(); });

    // ------------------------------------------------ cookie notice (shown once)
    let seen = false;
    try { seen = localStorage.getItem('bbr-cookies') === '1'; } catch {}
    if (!seen) {
      const note = document.createElement('aside');
      note.className = 'cookie'; note.setAttribute('aria-label', 'Aviso de cookies');
      note.innerHTML = '<p style="margin:0">Solo guardamos lo imprescindible para que la web funcione. Nada de publicidad ni rastreo. <a href="cookies.html">Más información</a></p><button type="button">Entendido</button>';
      note.querySelector('button').addEventListener('click', () => { try { localStorage.setItem('bbr-cookies', '1'); } catch {} note.classList.add('gone'); setTimeout(() => note.remove(), 300); });
      document.body.append(note);
    }
  })();
  </script>
</body>
</html>
